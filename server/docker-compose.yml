version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanfood-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    # ===== 安全加固: 挂载点 =====
    # uploads/logs 需要读写；其余文件系统只读
    volumes:
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
      - /tmp:/tmp:rw,noexec   # 临时目录
    # ===== 安全加固: 资源限制 =====
    # 防止容器耗尽宿主机资源（OOM / CPU 抢占）
    deploy:
      resources:
        limits:
          cpus: '1.0'         # 最多使用 1 个 CPU 核心
          memory: 512M        # 最多使用 512MB 内存
        reservations:
          cpus: '0.25'        # 基础 CPU 预留
          memory: 128M        # 基础内存预留
    # ===== 安全加固: 只读文件系统 =====
    # 整个容器文件系统只读，仅 uploads/logs 可写
    read_only: true
    # ===== 安全加固: 内核安全选项 =====
    # no-new-privileges: 禁止进程提升权限
    # cap_drop ALL: 移除所有 Linux capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ===== 安全加固: DNS 防止劫持 =====
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - scanfood-network

networks:
  scanfood-network:
    driver: bridge
